<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin - Add Exam</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6 offset-md-3">

            <div class="card shadow">

                <div class="card-header">
                    <h2 class="card-title mb-0">
                        Create New Exam
                    </h2>
                </div>

                <div class="card-body">

                    <!-- Success Message -->
                    <div
                        th:if="${success}"
                        class="alert alert-success"
                        th:text="${success}">
                    </div>

                    <!-- Error Message -->
                    <div
                        th:if="${error}"
                        class="alert alert-danger"
                        th:text="${error}">
                    </div>

                    <form
                        th:action="@{/admin/exams/save}"
                        th:object="${exam}"
                        method="post">

                        <!-- Exam Title -->
                        <div class="mb-3">

                            <label
                                for="title"
                                class="form-label">
                                Exam Title
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                th:field="*{title}"
                                placeholder="Enter exam title"
                                required>

                        </div>


                        <!-- Duration -->
                        <div class="mb-3">

                            <label
                                for="duration"
                                class="form-label">
                                Duration (in minutes)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="duration"
                                th:field="*{durationInMinutes}"
                                placeholder="Enter duration"
                                min="1"
                                required>

                        </div>


                        <!-- Subject -->
                        <div class="mb-3">

                            <label
                                for="subject"
                                class="form-label">
                                Subject
                            </label>

                            <select
                                id="subject"
                                class="form-select"
                                th:field="*{subject}">

                                <option value="">
                                    -- Select Subject --
                                </option>

                                <option
                                    th:each="subject : ${subjects}"
                                    th:value="${subject.id}"
                                    th:text="${subject.name}">
                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="bi bi-check-circle"></i>
                                Save Exam

                            </button>

                            <a
                                th:href="@{/admin/exams}"
                                class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>
                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
