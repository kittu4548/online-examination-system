<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Exam</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>

<div th:replace="~{fragments :: navbar}"></div>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-header">

                    <h2 class="mb-0">

                        <i class="bi bi-pencil-square me-2"></i>
                        Edit Exam

                    </h2>

                </div>


                <div class="card-body">

                    <!--
                        Current AdminController uses:
                        POST /admin/exams/save
                    -->
                    <form
                        th:action="@{/admin/exams/save}"
                        th:object="${exam}"
                        method="post">


                        <!-- Exam ID -->
                        <input
                            type="hidden"
                            th:field="*{id}">


                        <!-- Exam Title -->
                        <div class="mb-4">

                            <label
                                for="title"
                                class="form-label fw-semibold">

                                Exam Title

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                th:field="*{title}"
                                placeholder="Enter exam title"
                                required>

                        </div>


                        <!-- Duration -->
                        <div class="mb-4">

                            <label
                                for="durationInMinutes"
                                class="form-label fw-semibold">

                                Duration (in minutes)

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="durationInMinutes"
                                th:field="*{durationInMinutes}"
                                min="1"
                                placeholder="Enter duration"
                                required>

                        </div>


                        <!-- Subject -->
                        <div class="mb-4">

                            <label
                                for="subject"
                                class="form-label fw-semibold">

                                Subject

                            </label>

                            <select
                                id="subject"
                                class="form-select"
                                th:field="*{subject}">

                                <option value="">
                                    -- Select Subject --
                                </option>

                                <option
                                    th:each="subject : ${subjects}"
                                    th:value="${subject.id}"
                                    th:text="${subject.name}">
                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="bi bi-save me-2"></i>
                                Update Exam

                            </button>


                            <a
                                th:href="@{/admin/exams}"
                                class="btn btn-secondary">

                                <i class="bi bi-x-circle me-2"></i>
                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
