<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ProctorView</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.panel{border:0;border-radius:16px;box-shadow:0 8px 24px #172b4d12}.metric{font-size:2rem;font-weight:800;color:#153e75}</style></head><body><div class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold">ProctorView</h2><p class="text-muted mb-0">Exam integrity activity monitor</p></div><a class="btn btn-outline-primary" th:href="@{/admin/dashboard}">Back to Admin</a></div><div class="row g-3 mb-4"><div class="col-md-6"><div class="card panel p-3"><div class="text-muted">Recorded events</div><div class="metric" th:text="${totalEvents}">0</div></div></div><div class="col-md-6"><div class="card panel p-3"><div class="text-muted">Tab hidden events</div><div class="metric" th:text="${tabSwitches}">0</div></div></div></div><div class="card panel"><div class="card-body"><h5 class="mb-3">Recent exam activity</h5><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Time</th><th>Student</th><th>Exam</th><th>Event</th><th>Details</th></tr></thead><tbody><tr th:each="event : ${events}"><td th:text="${#temporals.format(event.occurredAt,'dd MMM yyyy HH:mm:ss')}"></td><td th:text="${event.student.fullName}"></td><td th:text="${event.exam.title}"></td><td><span class="badge text-bg-warning" th:text="${event.eventType}"></span></td><td th:text="${event.details}"></td></tr><tr th:if="${#lists.isEmpty(events)}"><td colspan="5" class="text-center text-muted py-4">No proctor events recorded yet.</td></tr></tbody></table></div><p class="small text-muted mb-0">This dashboard records browser visibility and focus signals. It cannot detect every external device or application.</p></div></div></div></body></html>
