
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Exam to Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <h2 class="mb-2">Assign Exam to Subject</h2>
    <p class="text-muted">
        Connect an existing examination to a subject.
    </p>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}"></div>

    <div th:if="${#lists.isEmpty(exams)}"
         class="alert alert-warning">
        No exams found. Create an exam first.
    </div>

    <div th:if="${#lists.isEmpty(subjects)}"
         class="alert alert-warning">
        No subjects found. Create a subject first.
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form th:action="@{/admin/exams/{examId}/subject(examId=${exam.id})}" method="post">

                <div class="mb-3" th:if="${exam == null}">
                    <label for="examId" class="form-label">
                        Select Exam
                    </label>

                    <select id="examId"
                            name="examId"
                            class="form-select"
                            required>
                        <option value="">-- Choose an exam --</option>

                        <option th:each="exam : ${exams}"
                                th:value="${exam.id}"
                                th:text="${exam.title}">
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="subjectId" class="form-label">
                        Select Subject
                    </label>

                    <select id="subjectId"
                            name="subjectId"
                            class="form-select"
                            required>
                        <option value="">-- Choose a subject --</option>

                        <option th:each="subject : ${subjects}"
                                th:value="${subject.id}"
                                th:text="${subject.name}">
                        </option>
                    </select>
                </div>

                <button type="submit"
                        class="btn btn-primary"
                        th:disabled="${#lists.isEmpty(exams) or #lists.isEmpty(subjects)}">
                    Assign Exam
                </button>

                <a th:href="@{/admin/exams}"
                   class="btn btn-outline-secondary ms-2">
                    Back to Exams
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
