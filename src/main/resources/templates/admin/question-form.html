<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${question.id == null ? 'Add Question' : 'Edit Question'}">
        Question Form
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments :: navbar}"></div>


<main class="container mt-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>
                <i class="bi bi-question-circle me-2"></i>

                <span th:if="${question.id == null}">
                    Add New Question
                </span>

                <span th:if="${question.id != null}">
                    Edit Question
                </span>
            </h2>

            <p class="text-muted mb-0">
                Create or update an exam question.
            </p>
        </div>

        <a
            th:href="@{/admin/questions}"
            class="btn btn-secondary">

            <i class="bi bi-arrow-left me-2"></i>
            Manage Questions

        </a>

    </div>


    <!-- SUCCESS MESSAGE -->
    <div
        th:if="${success}"
        class="alert alert-success alert-dismissible fade show"
        role="alert">

        <i class="bi bi-check-circle me-2"></i>

        <span th:text="${success}">
            Operation successful.
        </span>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>


    <!-- ERROR MESSAGE -->
    <div
        th:if="${error}"
        class="alert alert-danger alert-dismissible fade show"
        role="alert">

        <i class="bi bi-exclamation-triangle me-2"></i>

        <span th:text="${error}">
            Something went wrong.
        </span>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>


    <!-- FORM CARD -->
    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">

                <i class="bi bi-pencil-square me-2"></i>

                <span th:if="${question.id == null}">
                    Question Details
                </span>

                <span th:if="${question.id != null}">
                    Edit Question Details
                </span>

            </h5>

        </div>


        <div class="card-body">

            <!-- IMPORTANT:
                 Both ADD and EDIT use the same save endpoint.
            -->
            <form
                th:action="@{/admin/questions/save}"
                th:object="${question}"
                method="post">


                <!-- QUESTION ID -->
                <input
                    type="hidden"
                    th:field="*{id}">


                <!-- EXAM -->
                <div class="mb-4">

                    <label
                        for="exam"
                        class="form-label fw-semibold">

                        Select Exam

                    </label>

                    <select
                        id="exam"
                        class="form-select"
                        th:field="*{exam}"
                        required>

                        <option value="">
                            -- Select Exam --
                        </option>

                        <option
                            th:each="exam : ${exams}"
                            th:value="${exam.id}"
                            th:text="${exam.title}">
                        </option>

                    </select>

                </div>


                <!-- QUESTION TEXT -->
                <div class="mb-4">

                    <label
                        for="text"
                        class="form-label fw-semibold">

                        Question Text

                    </label>

                    <textarea
                        id="text"
                        class="form-control"
                        th:field="*{text}"
                        rows="4"
                        placeholder="Enter the question here..."
                        required></textarea>

                </div>


                <!-- OPTIONS -->
                <div class="row">

                    <!-- OPTION 1 -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="option1"
                            class="form-label fw-semibold">

                            Option 1

                        </label>

                        <input
                            type="text"
                            id="option1"
                            class="form-control"
                            th:field="*{option1}"
                            placeholder="Enter option 1"
                            required>

                    </div>


                    <!-- OPTION 2 -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="option2"
                            class="form-label fw-semibold">

                            Option 2

                        </label>

                        <input
                            type="text"
                            id="option2"
                            class="form-control"
                            th:field="*{option2}"
                            placeholder="Enter option 2"
                            required>

                    </div>


                    <!-- OPTION 3 -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="option3"
                            class="form-label fw-semibold">

                            Option 3

                        </label>

                        <input
                            type="text"
                            id="option3"
                            class="form-control"
                            th:field="*{option3}"
                            placeholder="Enter option 3"
                            required>

                    </div>


                    <!-- OPTION 4 -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="option4"
                            class="form-label fw-semibold">

                            Option 4

                        </label>

                        <input
                            type="text"
                            id="option4"
                            class="form-control"
                            th:field="*{option4}"
                            placeholder="Enter option 4"
                            required>

                    </div>

                </div>


                <hr class="my-4">


                <!-- CORRECT ANSWER + MARKS -->
                <div class="row">

                    <!-- CORRECT ANSWER -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="correctAnswer"
                            class="form-label fw-semibold">

                            Correct Answer

                        </label>

                        <select id="correctAnswer"
        class="form-select"
        th:field="*{correctAnswer}"
        required>

    <option th:value="1">Option 1</option>
    <option th:value="2">Option 2</option>
    <option th:value="3">Option 3</option>
    <option th:value="4">Option 4</option>
</select>

                    </div>


                    <!-- MARKS -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="marks"
                            class="form-label fw-semibold">

                            Marks

                        </label>

                        <input
                            type="number"
                            id="marks"
                            class="form-control"
                            th:field="*{marks}"
                            min="1"
                            placeholder="Enter marks"
                            required>

                    </div>

                </div>


                <!-- BUTTONS -->
                <div class="d-flex gap-2 mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="bi bi-save me-2"></i>

                        <span th:if="${question.id == null}">
                            Save Question
                        </span>

                        <span th:if="${question.id != null}">
                            Update Question
                        </span>

                    </button>


                    <a
                        th:href="@{/admin/questions}"
                        class="btn btn-secondary">

                        <i class="bi bi-x-circle me-2"></i>
                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
