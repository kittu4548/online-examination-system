<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Manage Exams</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">
</head>

<body>

<div th:replace="~{fragments :: navbar}"></div>


<div class="container mt-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-journal-text me-2"></i>
            Manage Exams
        </h2>

        <!-- CREATE EXAM -->
        <a
            th:href="@{/admin/exams/new}"
            class="btn btn-primary">

            <i class="bi bi-plus-circle-fill me-2"></i>
            Create New Exam

        </a>

    </div>


    <!-- EXAMS TABLE -->
    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>

                        <th>Exam Title</th>

                        <th>Duration (Mins)</th>

                        <th>Questions</th>

                        <th>Actions</th>

                    </tr>

                    </thead>


                    <tbody>

                    <!-- EXAM ROWS -->
                    <tr th:each="exam : ${exams}">

                        <!-- TITLE -->
                        <td>

                            <strong th:text="${exam.title}">
                                Sample Exam
                            </strong>

                        </td>


                        <!-- DURATION -->
                        <td th:text="${exam.durationInMinutes}">
                            60
                        </td>


                        <!-- QUESTIONS -->
                        <td>

                            <span
                                class="badge bg-primary"
                                th:text="${#lists.size(exam.questions)}">

                                0

                            </span>

                        </td>


                        <!-- ACTIONS -->
                        <td>

                            <!-- ADD QUESTIONS -->
                            <a
                                th:href="@{/admin/questions/new}"
                                class="btn btn-sm btn-success me-1"
                                title="Add Questions">

                                <i class="bi bi-plus-lg"></i>
                                Add Qs

                            </a>


                            <!-- RESULTS -->
                            <a
                                th:href="@{/admin/results}"
                                class="btn btn-sm btn-info me-1"
                                title="View Results">

                                <i class="bi bi-bar-chart-fill"></i>
                                Results

                            </a>


                            <!-- MANAGE QUESTIONS -->
                            <a
                                th:href="@{/admin/questions}"
                                class="btn btn-sm btn-secondary me-1"
                                title="Manage Questions">

                                <i class="bi bi-list-task"></i>
                                Manage Qs

                            </a>


                            <!-- EDIT EXAM -->
                            <a
                                th:href="@{/admin/exams/edit/{id}(id=${exam.id})}"
                                class="btn btn-sm btn-warning me-1"
                                title="Edit Exam">

                                <i class="bi bi-pencil-fill"></i>
                                Edit

                            </a>


                            <!-- DELETE EXAM -->
                            <a
                                th:href="@{/admin/exams/delete/{id}(id=${exam.id})}"
                                class="btn btn-sm btn-danger"
                                title="Delete Exam"
                                onclick="return confirm('Are you sure you want to delete this exam? This may delete associated questions and results. Continue?');">

                                <i class="bi bi-trash-fill"></i>
                                Delete

                            </a>

                        </td>

                    </tr>


                    <!-- NO EXAMS -->
                    <tr th:if="${#lists.isEmpty(exams)}">

                        <td
                            colspan="4"
                            class="text-center fst-italic py-4">

                            No exams found.

                            <a th:href="@{/admin/exams/new}">
                                Create New Exam
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
