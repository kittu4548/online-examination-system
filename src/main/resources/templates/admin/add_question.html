<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Question</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments :: navbar}"></div>


<main class="container mt-5">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1">
                <i class="bi bi-plus-circle me-2"></i>
                Add New Question
            </h2>

            <p class="text-muted mb-0">
                Create a multiple-choice question for an exam.
            </p>
        </div>

        <a th:href="@{/admin/questions}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left me-2"></i>
            Manage Questions

        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <i class="bi bi-check-circle me-2"></i>

        <span th:text="${success}">
            Question saved successfully.
        </span>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <i class="bi bi-exclamation-triangle me-2"></i>

        <span th:text="${error}">
            Unable to save question.
        </span>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>


    <!-- Question Form -->
    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                <i class="bi bi-question-circle me-2"></i>
                Question Details
            </h5>

        </div>


        <div class="card-body">

            <form
                th:action="@{/admin/questions/save}"
                th:object="${question}"
                method="post">


                <!-- Exam -->
                <div class="mb-4">

                    <label for="exam" class="form-label fw-semibold">
                        Select Exam
                    </label>

                    <select
                        id="exam"
                        class="form-select"
                        th:field="*{exam}"
                        required>

                        <option value="">
                            -- Select Exam --
                        </option>

                        <option
                            th:each="exam : ${exams}"
                            th:value="${exam.id}"
                            th:text="${exam.title}">
                        </option>

                    </select>

                </div>


                <!-- Question Text -->
                <div class="mb-4">

                    <label
                        for="text"
                        class="form-label fw-semibold">

                        Question Text
                    </label>

                    <textarea
                        class="form-control"
                        id="text"
                        th:field="*{text}"
                        rows="4"
                        placeholder="Enter the question here..."
                        required>
                    </textarea>

                </div>


                <!-- Options -->
                <div class="row">

                    <!-- Option 1 -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="option1"
                            class="form-label fw-semibold">

                            Option 1
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="option1"
                            th:field="*{option1}"
                            placeholder="Enter option 1"
                            required>

                    </div>


                    <!-- Option 2 -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="option2"
                            class="form-label fw-semibold">

                            Option 2
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="option2"
                            th:field="*{option2}"
                            placeholder="Enter option 2"
                            required>

                    </div>


                    <!-- Option 3 -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="option3"
                            class="form-label fw-semibold">

                            Option 3
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="option3"
                            th:field="*{option3}"
                            placeholder="Enter option 3"
                            required>

                    </div>


                    <!-- Option 4 -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="option4"
                            class="form-label fw-semibold">

                            Option 4
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="option4"
                            th:field="*{option4}"
                            placeholder="Enter option 4"
                            required>

                    </div>

                </div>


                <hr class="my-4">


                <!-- Correct Answer + Marks -->
                <div class="row">

                    <!-- Correct Answer -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="correctAnswer"
                            class="form-label fw-semibold">

                            Correct Answer

                        </label>

                        <select
                            class="form-select"
                            id="correctAnswer"
                            th:field="*{correctAnswer}"
                            required>

                            <option value="">
                                -- Select Correct Option --
                            </option>

                            <option value="1">
                                Option 1
                            </option>

                            <option value="2">
                                Option 2
                            </option>

                            <option value="3">
                                Option 3
                            </option>

                            <option value="4">
                                Option 4
                            </option>

                        </select>

                    </div>


                    <!-- Marks -->
                    <div class="col-md-6 mb-3">

                        <label
                            for="marks"
                            class="form-label fw-semibold">

                            Marks

                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="marks"
                            th:field="*{marks}"
                            min="1"
                            placeholder="Enter marks"
                            required>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2 mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="bi bi-save me-2"></i>
                        Save Question

                    </button>


                    <a
                        th:href="@{/admin/questions}"
                        class="btn btn-secondary">

                        <i class="bi bi-x-circle me-2"></i>
                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
