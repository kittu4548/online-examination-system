<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Manage Questions</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">
</head>

<body>

<div th:replace="~{fragments :: navbar}"></div>


<div class="container mt-5">

    <!-- SUCCESS MESSAGE -->
    <div
        th:if="${success}"
        class="alert alert-success alert-dismissible fade show"
        role="alert">

        <span th:text="${success}">
            Question operation successful.
        </span>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>


    <!-- ERROR MESSAGE -->
    <div
        th:if="${error}"
        class="alert alert-danger alert-dismissible fade show"
        role="alert">

        <span th:text="${error}">
            Something went wrong.
        </span>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>


    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1">
                <i class="bi bi-question-circle me-2"></i>
                Manage Questions
            </h2>

            <p class="text-muted mb-0">
                View, add, edit and delete exam questions.
            </p>
        </div>


        <!-- ADD QUESTION -->
        <a
            th:href="@{/admin/questions/new}"
            class="btn btn-primary">

            <i class="bi bi-plus-circle me-2"></i>
            Add New Question

        </a>

    </div>


    <!-- QUESTIONS TABLE -->
    <div class="card shadow-sm">

        <div class="card-header">
            <h5 class="mb-0">
                All Questions
            </h5>
        </div>


        <div class="card-body">

            <div
                th:if="${#lists.isEmpty(questions)}"
                class="alert alert-info mb-0">

                <i class="bi bi-info-circle me-2"></i>

                No questions have been added yet.

                <a
                    th:href="@{/admin/questions/new}"
                    class="alert-link">

                    Add the first question

                </a>

            </div>


            <div
                th:unless="${#lists.isEmpty(questions)}"
                class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>

                        <th style="width: 5%;">
                            #
                        </th>

                        <th style="width: 40%;">
                            Question
                        </th>

                        <th style="width: 15%;">
                            Marks
                        </th>

                        <th style="width: 20%;">
                            Correct Answer
                        </th>

                        <th style="width: 20%;">
                            Actions
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr
                        th:each="q, stat : ${questions}">

                        <!-- NUMBER -->
                        <td
                            th:text="${stat.count}">
                            1
                        </td>


                        <!-- QUESTION -->
                        <td>

                            <span
                                th:text="${q.text}">
                                Question text
                            </span>

                        </td>


                        <!-- MARKS -->
                        <td>

                            <span
                                class="badge bg-primary"
                                th:text="${q.marks}">
                                5
                            </span>

                        </td>


                        <!-- CORRECT ANSWER -->
                        <td>

                            <span
                                th:text="${q.correctAnswer}">
                                1
                            </span>

                        </td>


                        <!-- ACTIONS -->
                        <td>

                            <!-- EDIT -->
                            <a
                                th:href="@{/admin/questions/edit/{id}(id=${q.id})}"
                                class="btn btn-sm btn-warning me-1"
                                title="Edit Question">

                                <i class="bi bi-pencil-fill"></i>

                            </a>


                            <!-- DELETE -->
                            <a
                                th:href="@{/admin/questions/delete/{id}(id=${q.id})}"
                                class="btn btn-sm btn-danger"
                                title="Delete Question"
                                onclick="return confirm('Are you sure you want to delete this question?');">

                                <i class="bi bi-trash-fill"></i>

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- BACK BUTTON -->
    <div class="mt-4">

        <a
            th:href="@{/admin/exams}"
            class="btn btn-secondary">

            <i class="bi bi-arrow-left-circle me-2"></i>
            Back to Manage Exams

        </a>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
