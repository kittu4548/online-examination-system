<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Course Purchase Required</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 45px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 15px;
            color: #1f2937;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        .error {
            margin-top: 15px;
            color: #dc2626;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        🔒
    </div>

    <h2>Course Purchase Required</h2>

    <p>
        This exam belongs to a paid course.
    </p>

    <p>
        You need to purchase the course before
        accessing this exam.
    </p>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <a href="/student/dashboard"
       class="btn">
        Back to Dashboard
    </a>

</div>

</body>

</html>
