<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject.name}">Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>

<main class="container py-5">
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h1 class="h3" th:text="${subject.name}">Subject</h1>
            <p class="text-muted mb-0" th:text="${subject.description}">
                Subject description
            </p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="h5 mb-0">Published exams</h2>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(subjectExams)}" class="alert alert-info mb-0">
                No exams are currently available for this subject.
            </div>
            <div th:unless="${#lists.isEmpty(subjectExams)}" class="list-group">
                <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                   th:each="exam : ${subjectExams}"
                   th:href="@{/exam/{id}(id=${exam.id})}">
                    <span th:text="${exam.title}">Exam</span>
                    <span class="badge text-bg-primary"
                          th:text="${exam.durationInMinutes + ' minutes'}">30 minutes</span>
                </a>
            </div>
        </div>
    </div>

    <a class="btn btn-outline-secondary mt-4" th:href="@{/student/dashboard}">
        Back to dashboard
    </a>
</main>
</body>
</html>
