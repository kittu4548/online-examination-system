<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<div th:fragment="chatbot">

    <!-- =========================
         CSRF TOKEN
         ========================= -->
    <input type="hidden"
           id="chatbot-csrf-token"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">


    <!-- =========================
         CHATBOT STYLES
         ========================= -->
    <style>

        #chatbot-button {
            position: fixed;
            right: 25px;
            bottom: 25px;

            width: 60px;
            height: 60px;

            border: none;
            border-radius: 50%;

            background: #0d6efd;
            color: white;

            font-size: 26px;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);

            z-index: 9999;

            transition: transform 0.2s ease;
        }


        #chatbot-button:hover {
            transform: scale(1.08);
        }


        #chatbot-window {

            display: none;

            position: fixed;

            right: 25px;
            bottom: 95px;

            width: 380px;
            height: 540px;

            background: white;

            border-radius: 16px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);

            overflow: hidden;

            z-index: 9999;

            border: 1px solid #ddd;

            flex-direction: column;
        }


        /* =========================
           HEADER
           ========================= */

        #chatbot-header {

            background: linear-gradient(
                135deg,
                #0d6efd,
                #1265d8
            );

            color: white;

            padding: 15px 16px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        #chatbot-header-left {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        #chatbot-icon {

            font-size: 28px;
        }


        #chatbot-title {

            margin: 0;

            font-size: 19px;

            font-weight: 600;
        }


        #chatbot-status {

            font-size: 12px;

            opacity: 0.9;
        }


        #chatbot-close {

            border: none;

            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;

            line-height: 1;

            padding: 3px 7px;
        }


        #chatbot-close:hover {
            opacity: 0.8;
        }


        /* =========================
           MESSAGES
           ========================= */

        #chatbot-messages {

            flex: 1;

            overflow-y: auto;

            padding: 16px;

            background: #f5f7fb;
        }


        #chatbot-messages::-webkit-scrollbar {
            width: 7px;
        }


        #chatbot-messages::-webkit-scrollbar-thumb {
            background: #bbb;

            border-radius: 10px;
        }


        .chat-message {

            margin-bottom: 12px;

            padding: 11px 14px;

            border-radius: 14px;

            max-width: 85%;

            white-space: pre-line;

            word-wrap: break-word;

            line-height: 1.5;

            font-size: 15px;
        }


        .bot-message {

            background: #e9ecef;

            color: #222;

            margin-right: auto;

            border-bottom-left-radius: 4px;
        }


        .user-message {

            background: #0d6efd;

            color: white;

            margin-left: auto;

            border-bottom-right-radius: 4px;
        }


        /* =========================
           TYPING MESSAGE
           ========================= */

        .typing-message {

            background: #e9ecef;

            color: #555;

            margin-right: auto;

            border-bottom-left-radius: 4px;

            font-style: italic;
        }


        .typing-dots span {

            display: inline-block;

            width: 6px;
            height: 6px;

            margin: 0 2px;

            background: #777;

            border-radius: 50%;

            animation: typing 1.4s infinite;
        }


        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }


        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }


        @keyframes typing {

            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }


        /* =========================
           INPUT AREA
           ========================= */

        #chatbot-input-area {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 10px;

            border-top: 1px solid #ddd;

            background: white;
        }


        #chatbot-input {

            flex: 1;

            border: 1px solid #ccc;

            border-radius: 24px;

            padding: 11px 15px;

            font-size: 15px;

            outline: none;

            min-width: 0;
        }


        #chatbot-input:focus {

            border-color: #0d6efd;

            box-shadow: 0 0 0 2px rgba(
                13,
                110,
                253,
                0.1
            );
        }


        #chatbot-send {

            width: 44px;

            height: 44px;

            flex-shrink: 0;

            border: none;

            background: #0d6efd;

            color: white;

            border-radius: 50%;

            cursor: pointer;

            font-size: 18px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        #chatbot-send:hover {
            background: #0b5ed7;
        }


        #chatbot-send:disabled {

            background: #9bbcf0;

            cursor: not-allowed;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 500px) {

            #chatbot-window {

                right: 10px;

                bottom: 85px;

                width: calc(100% - 20px);

                height: 520px;
            }


            #chatbot-button {

                right: 15px;

                bottom: 15px;
            }
        }

    </style>


    <!-- =========================
         CHATBOT BUTTON
         ========================= -->

    <button id="chatbot-button"
            type="button"
            onclick="toggleChatbot()"
            aria-label="Open Exam Assistant">

        🤖

    </button>


    <!-- =========================
         CHATBOT WINDOW
         ========================= -->

    <div id="chatbot-window">


        <!-- HEADER -->

        <div id="chatbot-header">

            <div id="chatbot-header-left">

                <div id="chatbot-icon">
                    🤖
                </div>

                <div>

                    <h5 id="chatbot-title">
                        Exam Assistant
                    </h5>

                    <div id="chatbot-status">
                        ● Online
                    </div>

                </div>

            </div>


            <button id="chatbot-close"
                    type="button"
                    onclick="toggleChatbot()"
                    aria-label="Close chatbot">

                ×

            </button>

        </div>


        <!-- =========================
             MESSAGES
             ========================= -->

        <div id="chatbot-messages">

            <div class="chat-message bot-message">

                Hello! 👋 I'm your Exam Assistant.

                I can help you with:

                • Examinations
                • Exam instructions
                • Exam duration
                • Subjects
                • Course enrollment
                • Payments
                • Results

                Try asking:

                "How do I start an exam?"

            </div>

        </div>


        <!-- =========================
             INPUT
             ========================= -->

        <div id="chatbot-input-area">

            <input type="text"
                   id="chatbot-input"
                   placeholder="Ask something..."
                   autocomplete="off"
                   maxlength="1000">


            <button id="chatbot-send"
                    type="button"
                    onclick="sendChatMessage()"
                    aria-label="Send message">

                ➤

            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        /*
         * Open / Close Chatbot
         */

        function toggleChatbot() {

            const chatbot =
                document.getElementById("chatbot-window");


            if (chatbot.style.display === "flex") {

                chatbot.style.display = "none";

            } else {

                chatbot.style.display = "flex";

                const input =
                    document.getElementById("chatbot-input");

                setTimeout(function () {
                    input.focus();
                }, 100);
            }
        }


        /*
         * Add message to chat
         */

        function addMessage(message, type) {

            const messages =
                document.getElementById("chatbot-messages");


            const div =
                document.createElement("div");


            div.className =
                "chat-message " + type;


            div.textContent = message;


            messages.appendChild(div);


            messages.scrollTop =
                messages.scrollHeight;
        }


        /*
         * Show typing indicator
         */

        function showTypingIndicator() {

            const messages =
                document.getElementById("chatbot-messages");


            const div =
                document.createElement("div");


            div.id =
                "chatbot-typing";


            div.className =
                "chat-message typing-message";


            div.innerHTML = `
                Thinking
                <span class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            `;


            messages.appendChild(div);


            messages.scrollTop =
                messages.scrollHeight;
        }


        /*
         * Remove typing indicator
         */

        function removeTypingIndicator() {

            const typing =
                document.getElementById("chatbot-typing");


            if (typing) {
                typing.remove();
            }
        }


        /*
         * Send message to Spring Boot
         */

        async function sendChatMessage() {

            const input =
                document.getElementById("chatbot-input");


            const sendButton =
                document.getElementById("chatbot-send");


            const message =
                input.value.trim();


            if (!message) {
                return;
            }


            /*
             * Display user's message
             */

            addMessage(
                message,
                "user-message"
            );


            /*
             * Clear input
             */

            input.value = "";


            /*
             * Disable controls while waiting
             */

            input.disabled = true;

            sendButton.disabled = true;


            /*
             * Show typing
             */

            showTypingIndicator();


            try {

                /*
                 * Get CSRF token generated by Thymeleaf
                 */

                const csrfElement =
                    document.getElementById(
                        "chatbot-csrf-token"
                    );


                if (!csrfElement) {

                    throw new Error(
                        "CSRF token not found."
                    );
                }


                const csrfToken =
                    csrfElement.value;


                /*
                 * Send request
                 */

                const response =
                    await fetch(
                        "/api/chatbot/message",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "X-CSRF-TOKEN":
                                    csrfToken
                            },

                            body: JSON.stringify({
                                message: message
                            })
                        }
                    );


                /*
                 * Remove typing
                 */

                removeTypingIndicator();


                /*
                 * Handle HTTP errors
                 */

                if (!response.ok) {

                    let errorMessage =
                        "Unable to contact the chatbot.";

                    try {

                        const errorData =
                            await response.json();

                        if (errorData.reply) {
                            errorMessage =
                                errorData.reply;
                        }

                    } catch (ignored) {
                        // Response was not JSON
                    }


                    throw new Error(
                        errorMessage
                    );
                }


                /*
                 * Read response
                 */

                const data =
                    await response.json();


                /*
                 * Display Gemini response
                 */

                if (data.reply) {

                    addMessage(
                        data.reply,
                        "bot-message"
                    );

                } else {

                    addMessage(
                        "Sorry, I received an empty response.",
                        "bot-message"
                    );
                }


            } catch (error) {

                console.error(
                    "Chatbot error:",
                    error
                );


                removeTypingIndicator();


                addMessage(
                    "Sorry, I couldn't process your request. Please try again.",
                    "bot-message"
                );

            } finally {

                /*
                 * Enable controls
                 */

                input.disabled = false;

                sendButton.disabled = false;

                input.focus();
            }
        }


        /*
         * Press ENTER to send
         */

        document
            .getElementById("chatbot-input")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        sendChatMessage();
                    }
                }
            );

    </script>

</div>

</html>
