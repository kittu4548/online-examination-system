
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explore Subjects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #f5f7fb; }
        .subject-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
            transition: transform .2s, box-shadow .2s;
        }
        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0,0,0,.10);
        }
        .subject-image {
            height: 180px;
            width: 100%;
            object-fit: cover;
            background: #e8edf5;
        }
        .price { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="mb-4">
        <h1 class="fw-bold">Explore Subjects</h1>
        <p class="text-secondary">
            Choose a subject and start preparing for your exams.
        </p>
    </div>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-4"
             th:each="subject : ${subjects}">
            <div class="card subject-card h-100 shadow-sm">

                <img th:if="${subject.imageUrl != null and !#strings.isEmpty(subject.imageUrl)}"
                     th:src="${subject.imageUrl}"
                     class="subject-image"
                     th:alt="${subject.name}">

                <div th:unless="${subject.imageUrl != null and !#strings.isEmpty(subject.imageUrl)}"
                     class="subject-image d-flex align-items-center justify-content-center">
                    <span class="display-4 text-secondary">📚</span>
                </div>

                <div class="card-body d-flex flex-column p-4">
                    <h4 class="fw-bold" th:text="${subject.name}">
                        Subject Name
                    </h4>

                    <p class="text-secondary"
                       th:text="${subject.description}">
                        Subject description
                    </p>

                    <div class="mt-auto">
                        <div th:if="${subject.accessType == 'FREE'}">
                            <div class="price text-success">Free</div>
                            <span class="badge bg-success mb-3">
                                Free access
                            </span>
                            <p class="small text-secondary">
                                Available without a subscription.
                            </p>
                        </div>

                        <div th:if="${subject.accessType == 'PAID'}">
                            <div class="price"
                                 th:text="${'₹' + subject.price}">
                                ₹499
                            </div>
                            <span class="badge bg-warning text-dark mb-3"
                                  th:text="${subject.subscriptionDuration}">
                                YEARLY
                            </span>
                            <p class="small text-secondary">
                                Subscription required for access.
                            </p>
                        </div>

                        <button th:if="${subject.accessType == 'FREE'}"
                                class="btn btn-success w-100"
                                type="button" disabled>
                            Free access — content linking next
                        </button>

                        <button th:if="${subject.accessType == 'PAID'}"
                                class="btn btn-primary w-100"
                                type="button" disabled>
                            Subscription checkout — next stage
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(subjects)}"
             class="col-12">
            <div class="alert alert-info">
                No subjects are published yet. Please check again later.
            </div>
        </div>
    </div>

    <a th:href="@{/student/dashboard}"
       class="btn btn-outline-secondary mt-4">
        Back to Dashboard
    </a>
</div>

</body>
</html>
